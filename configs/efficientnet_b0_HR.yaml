# EfficientNet-B0 — HR
# Üreten notebook: 06_efficientnet.ipynb
# Transfer learning (ImageNet pretrained), iki aşamalı fine-tuning.
model:
  name: "efficientnet_b0"
  pretrained: true             # ImageNet
  num_classes: 3
data:
  resolution: "HR"
  patch_size: 128
  num_classes: 3
  class_names: ["tubules", "branches", "both"]
  num_workers: 2
  normalize: true            # ImageNet mean/std (pretrained)

split:
  strategy: "roi_based"        # ROI bazlı — veri sızıntısını önlemek için
  train_rois: [1, 2, 3, 4]
  val_rois: [5]
  test_rois: [6]
  random_seed: 42

augmentation:
  random_horizontal_flip: 0.5
  random_vertical_flip: 0.5
  random_rotation: 30

logging:
  save_best_only: true         # en iyi val doğruluğundaki ağırlık kaydedilir

training:
  batch_size: 64               # A100 GPU — büyük batch
  num_epochs: 20
  # Aşama 1: backbone donduruldu, yalnız classifier eğitildi
  phase1:
    epochs: 3
    optimizer: "adam"
    learning_rate: 1.0e-3
    weight_decay: 1.0e-4
    trainable: "classifier_only"
  # Aşama 2: tüm ağ çözüldü (full fine-tune)
  phase2:
    epochs: 20
    optimizer: "adamw"
    learning_rate: 1.0e-4
    weight_decay: 1.0e-4
    scheduler: "cosine"        # CosineAnnealingLR, T_max=20
    trainable: "all"
